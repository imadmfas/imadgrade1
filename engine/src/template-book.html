<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="/*COLOR*/">
<title>/*TITLE*/ — مكتبتي الملوّنة</title>
<link rel="manifest" href="../manifest.webmanifest">
<style>
/*STYLE*/
/* ---------- الغلاف ---------- */
#cover{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;background:linear-gradient(160deg,var(--c1),color-mix(in srgb,var(--c1) 70%,#000 8%));color:#fff;overflow:auto}
#cover::before{content:'';position:absolute;inset:14px;border:4px dashed rgba(255,255,255,.45);border-radius:28px;pointer-events:none}
#cMascot{width:min(150px,30vmin);height:min(155px,31vmin);cursor:pointer}
#cTitle{margin:0;font-size:clamp(40px,9vmin,72px);font-weight:700;line-height:1.5;text-shadow:0 4px 0 rgba(0,0,0,.15)}
#cGrade{margin:0;font-size:clamp(26px,5vmin,36px);font-weight:600}
.badge{display:inline-block;background:#fff;color:var(--c1);padding:4px 18px;border-radius:30px;font-size:clamp(17px,3.4vmin,22px);font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.credit{font-size:clamp(14px,2.8vmin,17px);opacity:.95;max-width:560px;line-height:1.7}
#coverGo{margin-top:8px;min-width:240px;height:84px;border-radius:44px;background:#ffd43b;color:#4a3426;font-size:clamp(32px,6vmin,40px);font-weight:700;box-shadow:0 7px 0 #e0a800;border:none;cursor:pointer;opacity:.55}
#coverGo.ready{opacity:1;animation:breathe 1.6s ease-in-out infinite}
body.rm #coverGo.ready{animation:none}
@keyframes breathe{50%{transform:scale(1.06)}}
/* ---------- الخريطة ---------- */
#map{position:fixed;inset:0;display:flex;flex-direction:column;z-index:5}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));z-index:6}
.topbar .grow{flex:1;min-width:0;text-align:center;font-size:28px;font-weight:700;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#road{position:relative;margin:0 auto;max-width:720px;width:100%}
.road-svg{position:absolute;left:0;top:0}
.road-base{fill:none;stroke:#f3d9a4;stroke-width:46;stroke-linecap:round}
.road-dash{fill:none;stroke:#fff;stroke-width:6;stroke-dasharray:4 22;stroke-linecap:round}
.deco{position:absolute;width:84px;height:84px;opacity:.9;pointer-events:none}
.deco svg{width:100%;height:100%}
.station,.node{position:absolute;transform:translate(-50%,-50%)}
.station{display:flex;flex-direction:column;align-items:center;gap:2px;background:none}
.flag{width:84px;height:84px;border-radius:50%;background:var(--c2);color:#fff;font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 color-mix(in srgb,var(--c2) 70%,#000 25%);border:5px solid #fff}
.st-title{background:#fff;border-radius:16px;padding:0 14px;font-size:28px;font-weight:700;white-space:normal;max-width:min(340px,86vw);text-align:center;line-height:1.45;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.node{width:104px;height:104px;border-radius:50%;background:var(--c1);color:#fff;border:6px solid #fff;box-shadow:0 7px 0 color-mix(in srgb,var(--c1) 70%,#000 25%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.node.full{background:#40c057;box-shadow:0 7px 0 #2b8a3e}
.node.next{animation:pulse 1.4s ease-in-out infinite}
body.rm .node.next{animation:none}
@keyframes pulse{50%{box-shadow:0 7px 0 color-mix(in srgb,var(--c1) 70%,#000 25%),0 0 0 14px rgba(255,212,59,.6)}}
.n-title{font-size:52px;font-weight:700;line-height:1}
.n-stars{position:absolute;bottom:-38px;white-space:nowrap;font-family:sans-serif;font-size:24px;color:#d9cbb0}
.n-stars i{font-style:normal}.n-stars i.on{color:#fcc419;text-shadow:0 2px 0 #e8a300}
.map-mascot{position:absolute;width:86px;height:90px;transform:translate(40px,-118px);z-index:2;cursor:pointer}.map-mascot.left{transform:translate(-126px,-118px)}
/* ---------- الدرس ---------- */
#lesson{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;grid-template-areas:"home head again" "main main main" "prev stars next";gap:8px 10px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
#bHome{grid-area:home}#bAgain{grid-area:again}#bPrev{grid-area:prev}#bNext{grid-area:next}
.l-head{grid-area:head;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.4;min-width:0;font-family:'Noto Naskh Arabic',serif;color:#7a6650}
#lUnit{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#lPage{font-size:14px}
#lStars{grid-area:stars;align-self:center;text-align:center;font-family:sans-serif;font-size:34px;color:#e4d6bb;white-space:nowrap}
#lStars i{font-style:normal;display:inline-block}
#lStars i.on{color:#fcc419;text-shadow:0 2px 0 #e8a300}
#lStars i.cur{transform:translateY(-4px) scale(1.15)}
#book3d{grid-area:main;min-height:0;position:relative;perspective:1600px;display:flex;flex-direction:column}
.speaker{position:relative;z-index:8;display:flex;align-items:center;gap:6px;min-height:76px;padding:0 4px 4px}
#lMascot{flex:none;width:72px;height:76px;cursor:pointer}
#bubble{flex:1;min-width:0;background:#fff;border-radius:22px;padding:2px 16px;font-size:clamp(28px,4.4vmin,34px);font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.08);line-height:1.75;text-align:center;pointer-events:none;border:3px solid var(--soft);position:relative;min-height:62px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:.3em}
#bubble::before{content:'';position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
#page{position:relative;flex:1;min-height:0;width:100%;max-width:1100px;margin:0 auto;transform-style:preserve-3d}
.sheet{position:absolute;inset:0;background:var(--paper);border-radius:28px;box-shadow:0 8px 0 color-mix(in srgb,var(--c1) 30%,#d8c39c),0 16px 36px rgba(0,0,0,.1);display:flex;flex-direction:column;overflow:hidden;transform-origin:50% 100%;border:4px solid #fff}
.sheet.pop-up{animation:popup .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popup{0%{transform:rotateX(70deg) scale(.92);opacity:.2}100%{transform:none;opacity:1}}
.sheet.turn-out{transform-origin:0 50%;animation:turnout .45s ease-in forwards}
.sheet.turn-back{transform-origin:100% 50%;animation:turnback .45s ease-in forwards}
@keyframes turnout{to{transform:rotateY(-100deg) skewY(4deg);opacity:.4;filter:brightness(.85)}}
@keyframes turnback{to{transform:rotateY(100deg) skewY(-4deg);opacity:.4;filter:brightness(.85)}}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px}
/* عناصر الألعاب */
.card{background:#fff;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative}
.card .pic{width:var(--pic);height:var(--pic)}
.card .pic svg{width:100%;height:100%}
.card .word{font-size:clamp(28px,4.6vmin,40px);font-weight:700;line-height:1.9}
.card .tick{position:absolute;top:4px;left:8px;font-style:normal;color:#40c057;font-size:26px;opacity:0;font-family:sans-serif}
.card.seen{box-shadow:0 5px 0 #8ce99a,0 0 0 4px #b2f2bb}
.card.seen .tick{opacity:1}
.g-listen{width:100%;height:100%;display:flex;align-items:center;gap:14px;--pic:min(15vmin,110px)}
.big-letter{flex:none;width:min(36vmin,240px);height:min(36vmin,240px);border-radius:46%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 color-mix(in srgb,var(--c2) 40%,#fff),inset 0 0 0 6px color-mix(in srgb,var(--c2) 25%,#fff);cursor:pointer}
.big-letter span{font-size:min(26vmin,170px);color:var(--c1);font-weight:700;line-height:1}
.g-listen .cards{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:center}
@media (orientation:portrait){.g-listen{flex-direction:column;justify-content:space-evenly;gap:8px}.g-listen .cards{grid-template-columns:repeat(3,1fr);flex:none;width:100%;gap:8px}.g-listen{--pic:min(8vh,17vw)}.big-letter{width:max(150px,min(18vh,40vw));height:max(150px,min(18vh,40vw))}.big-letter span{font-size:max(124px,min(14vh,30vw))}.card .word{font-size:28px;line-height:1.7}}
@media (orientation:portrait) and (min-width:700px){.g-listen .cards{grid-template-columns:repeat(4,1fr)}}
/* التتبّع */
.g-trace{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tr-wrap{position:relative;flex:none;touch-action:none;background:#fff;border-radius:34px;box-shadow:inset 0 0 0 5px var(--soft)}
.tr-svg,.tr-canvas{position:absolute;inset:0;width:100%;height:100%}
.tr-canvas{pointer-events:none}
.tr-guide{fill:none;stroke:#f1e6d2;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.tr-guide-dot{fill:#f1e6d2}
.tr-dash{fill:none;stroke:#c9b48f;stroke-width:1.6;stroke-dasharray:.1 4;stroke-linecap:round;opacity:.5}
.tr-dash.cur{opacity:1;stroke:#8a6d43}
.tr-arrow{fill:none;stroke:var(--c2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tr-start{fill:#40c057;stroke:#fff;stroke-width:1.6}
.tr-fill{fill:none;stroke:var(--c1);stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1s ease}
.tr-fill.on{stroke-dashoffset:0}
.tr-fill-dot{fill:var(--c1);opacity:0;transition:opacity .6s .6s}.tr-fill-dot.on{opacity:1}
/* البالونات */
.g-balloons{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.sky{display:flex;gap:min(5vw,40px);align-items:center;justify-content:center;flex-wrap:wrap}
.balloon{position:relative;width:min(26vw,24vh,170px);height:calc(min(26vw,24vh,170px)*1.5);background:none;padding:0}
.balloon svg{width:100%;height:100%;overflow:visible}
.balloon .txt{position:absolute;top:33%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:max(40px,min(13vw,11vh,72px));font-weight:700;color:#3b2a1a;text-shadow:0 0 6px #fff,0 0 3px #fff,0 0 2px #fff;line-height:1.6}
/* المطابقة */
.g-match{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:10px}
.pics{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pic-card{width:min(27vw,26vh,190px);height:calc(min(27vw,26vh,190px) + 52px);background:#fff;border-radius:26px;box-shadow:0 5px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 6px 0;border:4px dashed transparent;transition:border-color .2s,transform .2s}
.pic-card svg{width:100%;flex:1;min-height:0}
.pic-card .lbl{height:52px;font-size:clamp(28px,4.4vmin,36px);font-weight:700;color:var(--c1);line-height:1.6}
.pic-card.near{border-color:var(--c2);transform:scale(1.05)}
.pic-card.ok{border-color:#40c057;border-style:solid}
.dock{min-height:100px;display:flex;align-items:center;justify-content:center}
.word-card,.piece{background:#fff;border-radius:22px;padding:4px 26px;font-size:clamp(40px,7vmin,60px);font-weight:700;color:var(--ink);box-shadow:0 6px 0 color-mix(in srgb,var(--c2) 45%,#fff),0 10px 20px rgba(0,0,0,.08);border:4px solid color-mix(in srgb,var(--c2) 50%,#fff);touch-action:none;cursor:grab;min-width:96px;min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.7;position:relative;z-index:3}
.word-card.drag,.piece.drag{z-index:50;cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.2)}
/* تركيب الكلمة */
.g-build{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:8px}
.target{display:flex;align-items:center;gap:14px}
.t-pic{width:min(20vmin,130px);height:min(20vmin,130px)}.t-pic svg{width:100%;height:100%}
.ear{width:72px;height:72px;border-radius:50%;background:#fff;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.1);font-family:sans-serif}
.slots{display:flex;gap:14px;min-height:110px;align-items:center}
.slot{width:min(28vw,150px);height:100px;border-radius:24px;border:5px dashed color-mix(in srgb,var(--c1) 50%,#fff);background:color-mix(in srgb,var(--soft) 50%,#fff);font-size:clamp(40px,7vmin,60px);font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1.7;transition:transform .2s}
.slot.near{transform:scale(1.07);border-color:var(--c2)}
.slot.full{border-style:solid;border-color:#40c057;background:#ebfbee}
.joined{font-size:min(20vmin,120px);font-weight:700;color:var(--c1);line-height:1.6;padding:0 20px}
.pool{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
/* الملصق */
.sticker-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.sticker{width:min(40vmin,240px);height:min(40vmin,240px);border-radius:50%;background:#fff;padding:24px;box-shadow:0 0 0 10px #ffe066,0 10px 0 10px #f5c518;filter:grayscale(1);opacity:.4}
.sticker.got{filter:none;opacity:1}
.sticker svg{width:100%;height:100%}
.st-name{font-size:clamp(30px,5vmin,40px);font-weight:700}
.st-row{display:flex;gap:16px}
/* دفتر الملصقات */
#stickers{position:fixed;inset:0;display:flex;flex-direction:column;z-index:6}
#stGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;padding:16px;align-content:start;max-width:900px;margin:0 auto;width:100%}
.st-cell{background:#fff;border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.08);filter:grayscale(1);opacity:.45}
.st-cell.got{filter:none;opacity:1;box-shadow:0 0 0 5px #ffe066,0 5px 0 5px #f5c518}
.st-cell svg{width:90px;height:90px}.st-cell span{font-size:32px;font-weight:700}
body[data-view=lesson] #bAdult{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%)}
body[data-view=lesson] #lStars{grid-area:head;align-self:start;line-height:1.3}
body[data-view=lesson] .l-head{grid-area:head;align-self:end}
#lUnit{display:none}
.slot{width:min(28vw,24vmin,200px);height:min(100px,16vmin);min-height:80px}
.word-card,.piece{font-size:clamp(40px,8vmin,72px)}
.t-pic{width:min(22vmin,160px);height:min(22vmin,160px)}
.ear{width:min(13vmin,90px);height:min(13vmin,90px);min-width:72px;min-height:72px;font-size:clamp(34px,6vmin,48px)}
/* قوالب إضافية */
.card.noart{min-height:90px}
.g-choose,.g-complete{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opt{background:#fff;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px;border:4px solid transparent;min-width:96px}
.opt .opic{width:min(24vw,22vh,150px);height:min(24vw,22vh,150px);display:flex;align-items:flex-end;justify-content:center}
.opt .opic svg{width:calc(100% * var(--sc));height:calc(100% * var(--sc))}
.opt .otxt,.mcard .otxt,.sitem .otxt{font-size:clamp(30px,5.5vmin,46px);font-weight:700;line-height:1.7}
.opt.ok{border-color:#40c057;background:#ebfbee}
.opt.letter .otxt{font-size:clamp(44px,8vmin,64px)}
.train-track{position:relative;width:min(92%,640px);height:70px;border-bottom:6px solid #8a6d43;margin-bottom:6px}
.train-track .station{position:absolute;left:0;bottom:4px;font-size:44px;font-family:sans-serif}
.train{position:absolute;right:0;bottom:2px;display:flex;flex-direction:row;align-items:flex-end;gap:4px;font-family:sans-serif}
.train .loco{font-size:50px;display:inline-block;transform:scaleX(-1)}
.wagon{width:36px;height:26px;border-radius:6px;background:var(--c);border:3px solid #4a3426;margin-bottom:4px}
.g-memory{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.mgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px;width:min(100%,640px)}
.mcard{position:relative;aspect-ratio:1;border-radius:20px;background:var(--c2);box-shadow:0 5px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.mcard .back{font-size:40px;font-family:sans-serif}.mcard .face{display:none;width:86%;height:86%;align-items:center;justify-content:center}
.mcard .face svg{width:100%;height:100%}
.mcard.up{background:#fff;transform:rotateY(180deg) scaleX(-1)}.mcard.up .back{display:none}.mcard.up .face{display:flex}
.mcard.ok{box-shadow:0 0 0 5px #8ce99a}
.g-sort{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:10px}
.bins{display:flex;gap:18px;justify-content:center;width:100%}
.bin{flex:1;max-width:280px;min-height:150px;background:#fff;border-radius:26px;border:4px dashed color-mix(in srgb,var(--c2) 50%,#fff);display:flex;flex-direction:column;align-items:center;padding:8px}
.bin.near{border-color:var(--c1);transform:scale(1.04)}
.bl{font-size:clamp(28px,4.2vmin,34px);font-weight:700;color:var(--c1);line-height:1.6}
.basket{font-size:46px;font-family:sans-serif}.bin .in{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:28px;font-style:normal}
.bin .in i{font-style:normal}
.tray{min-height:110px;display:flex;align-items:center}
.sitem{background:#fff;border-radius:22px;padding:4px 22px;box-shadow:0 6px 0 color-mix(in srgb,var(--c2) 45%,#fff);border:4px solid color-mix(in srgb,var(--c2) 50%,#fff);touch-action:none;cursor:grab;min-width:96px;min-height:84px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:3}
.sitem svg{width:70px;height:70px}
.g-order{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:10px}
.oslots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:100px;align-items:center}
.oslot{width:auto;min-width:min(26vw,150px);padding:0 10px}
.opool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.joined.small{font-size:clamp(34px,7vmin,56px)}
.cword{display:flex;align-items:center;gap:16px;background:#fff;border-radius:26px;padding:6px 28px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.cpic{width:min(20vmin,120px);height:min(20vmin,120px)}.cpic svg{width:100%;height:100%}
.ctext{font-size:min(18vmin,96px);font-weight:700;line-height:1.7}
.ctext .gap{color:#e9dcc4;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(201,180,143,.25) 6px 12px);border-radius:8px;transition:color .4s}
.ctext .gap.filled{color:var(--c1);background:none}
.g-scene,.g-puzzle{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:14px}
@media (orientation:portrait){.g-scene,.g-puzzle{flex-direction:column}}
.sframe{width:min(100%,640px);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.scene-svg{display:block;width:100%;height:auto}.sitem-g{cursor:pointer}
.prompts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.prompt{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.1);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:2px}
.prompt span{font-family:sans-serif;font-size:24px}.prompt.seen{background:#ebfbee}
@media (max-height:520px){.prompts{gap:8px;max-height:100%;overflow:auto;align-content:safe center;padding:4px}.prompt{width:66px;height:66px;font-size:26px}.prompt span{font-size:20px}}
.pboard{display:grid;grid-template-columns:repeat(var(--cols),1fr);width:min(100%,560px);aspect-ratio:400/260;border-radius:18px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 4px #eadfc9}
.pslot{border:2px dashed #e1d3b8;display:flex}.pslot.full{border:none}
.pslot svg,.ppiece svg{width:100%;height:100%;display:block}
.ppool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ppiece{width:min(28vw,150px);background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.12);touch-action:none;cursor:grab;position:relative;z-index:3}
.g-read{width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;max-width:900px;margin:0 auto;overflow:auto}.g-read>.rline:first-child{margin-top:auto}.g-read>.rline:last-child{margin-bottom:auto}
.rline{background:#fff;border-radius:22px;padding:6px 18px;font-size:clamp(28px,5vmin,40px);font-weight:600;line-height:1.9;box-shadow:0 4px 0 rgba(0,0,0,.07);text-align:right}
.rline span{border-radius:8px;transition:background .2s}.rline span.on{background:#fff3bf;color:var(--c1)}
.rline.seen{box-shadow:0 4px 0 #8ce99a}
.nashid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
.n-art{width:min(100%,520px);border-radius:22px;overflow:hidden}.nashid .n-title{font-size:clamp(34px,6vmin,52px);font-weight:700;color:var(--c1)}
.n-poet,.n-book{font-size:18px;color:#7a6650;font-family:'Noto Naskh Arabic',serif}
.node.nashid{background:#b197fc;box-shadow:0 7px 0 #7950f2}.node.open{background:var(--c2)}
.slots{flex-wrap:wrap;justify-content:center;max-width:100%}.slots .slot{min-width:72px}
.g-build .slots:has(.slot:nth-child(4)) .slot{width:min(21vw,130px)}
